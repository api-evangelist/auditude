name: Auditude
description: 'Auditude was a Palo Alto video advertising technology company founded
  in 2007 that let premium publishers, content owners and media companies manage,
  serve and monetize advertising around online video across multiple platforms and
  devices via its proprietary Auditude Connect platform. Backed by Redpoint Ventures
  and Greylock Partners with roughly $38M raised, its customers included Comcast,
  Sony Music and Universal Music Group. Adobe acquired Auditude in November 2011 for
  a reported ~$120M and folded the technology into Adobe Primetime (ad decisioning /
  ad insertion), since rebranded under Adobe Pass. Auditude no longer operates as an
  independent company: auditude.com does not resolve, and the only surviving public
  footprint is the legacy com.auditude.ads.* namespace inside Adobe''s Primetime
  Player SDK documentation. This profile is retained as a defunct / acquired
  historical record; there is no Auditude API surface to catalog.'
